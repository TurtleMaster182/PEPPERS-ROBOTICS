<dialog id="detailDialog" aria-labelledby="detailTitle">
  <div class="dialog-inner">
    <header class="dialog-header">
      <div>
        <p class="eyebrow" id="detailLabel"></p>
        <h2 id="detailTitle"></h2>
      </div>
      <button type="button" class="icon-button" data-close-dialog aria-label="Close details">✕</button>
    </header>
    <p id="detailDescription" class="dialog-description"></p>
    <div id="detailContent"></div>
  </div>
</dialog>
