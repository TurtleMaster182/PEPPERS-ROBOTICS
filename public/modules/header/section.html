<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#home" aria-label="Peppers Robotics home"><img class="brand-mark" src="photos/19044.png" alt="" width="32" height="32">PEPPERS<span>19044</span></a>
    <nav id="siteNav" aria-label="Main navigation">
      <a href="#about">About</a><a href="#events">News</a><a href="#showcase">Projects</a><a href="#seasons">Robots</a><a href="#gallery">Memories</a><a href="#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="themeToggle" type="button" aria-label="Switch to light theme" aria-pressed="false"><span aria-hidden="true">◐</span></button>
      <a class="button button-accent nav-cta" href="#sponsors">Support us <span aria-hidden="true">↗</span></a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-controls="siteNav" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
    </div>
  </div>
  <div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>
  <!-- Decorative peppers hanging from the header. Change --x (position), --len (string length) or add a class: is-green, is-dark. -->
  <div class="pepper-garland" aria-hidden="true">
    <svg class="pepper-defs" width="0" height="0" focusable="false">
      <symbol id="pepper-shape" viewBox="0 0 40 100">
        <path d="M21 1c-1 6 1 10 0 16" fill="none" stroke="#1f7a32" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M10 20c4-8 16-8 20 0-6 3-14 3-20 0z" fill="#2fa14a"/>
        <path d="M11 21c-7 22-3 49 12 75 2 3 6 2 5-2-5-24 3-49 1-73-6 3-12 3-18 0z" fill="currentColor"/>
        <path d="M15 28c-3 18-1 35 6 52" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/>
      </symbol>
    </svg>
    <span class="hanging-pepper" data-pepper style="--x: 7%; --len: 46px;"><span class="pepper-string"></span><svg class="pepper-body" viewBox="0 0 40 100" focusable="false"><use href="#pepper-shape"/></svg></span>
    <span class="hanging-pepper is-dark" data-pepper style="--x: 23%; --len: 88px;"><span class="pepper-string"></span><svg class="pepper-body" viewBox="0 0 40 100" focusable="false"><use href="#pepper-shape"/></svg></span>
    <span class="hanging-pepper is-green" data-pepper style="--x: 61%; --len: 62px;"><span class="pepper-string"></span><svg class="pepper-body" viewBox="0 0 40 100" focusable="false"><use href="#pepper-shape"/></svg></span>
    <span class="hanging-pepper" data-pepper style="--x: 82%; --len: 104px;"><span class="pepper-string"></span><svg class="pepper-body" viewBox="0 0 40 100" focusable="false"><use href="#pepper-shape"/></svg></span>
    <span class="hanging-pepper is-dark" data-pepper style="--x: 95%; --len: 40px;"><span class="pepper-string"></span><svg class="pepper-body" viewBox="0 0 40 100" focusable="false"><use href="#pepper-shape"/></svg></span>
  </div>
</header>
